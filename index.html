<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>devChallenges.io | Minimal Blog Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --color-bg: #eef0f5;
        --color-card: #ffffff;
        --color-image-bg: #f6dbd0;
        --color-tag-bg: #ede6fb;
        --color-tag-text: #7c4ee4;
        --color-title: #16181d;
        --color-body: #6b7280;
        --color-footer: #374151;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: var(--color-bg);
        font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
        padding: 24px 16px;
      }

      .card {
        width: 100%;
        max-width: 368px;
        background-color: var(--color-card);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 40px -24px rgba(22, 24, 29, 0.25);
      }

      .card__image {
        height: 152px;
        background-color: var(--color-image-bg);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .card__image svg {
        width: 100%;
        height: 100%;
      }

      .card__content {
        padding: 16px;
      }

      .tag {
        display: inline-block;
        background-color: var(--color-tag-bg);
        color: var(--color-tag-text);
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        padding: 6px 10px;
        border-radius: 6px;
        margin-bottom: 16px;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
        color: var(--color-title);
        margin-bottom: 6px;
      }

      .description {
        font-size: 14px;
        line-height: 1.55;
        color: var(--color-body);
        margin-bottom: 20px;
      }

      .author {
        font-size: 14px;
        font-weight: 500;
        color: var(--color-footer);
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        text-decoration: none;
        color: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Design

  Embracing Minimalism

  From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.

  Annie Spratt -->

    <article class="card">
      <div class="card__image">
        <img src="./resources/Cactus.jpg" alt="Embracing Minimalism" />
      </div>

      <div class="card__content">
        <span class="tag">Design</span>
        <h1 class="title">Embracing Minimalism</h1>
        <p class="description">
          From minimalist sculptures to minimalist paintings, this blog will
          inspire you to appreciate the beauty that lies in simplicity.
        </p>
        <p class="author">Annie Spratt</p>
      </div>
    </article>

    <div class="author-info">
      Coded by <a href="#">Silvana Cheaib</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>

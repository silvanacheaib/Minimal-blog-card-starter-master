<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>devChallenges.io | Minimal Blog Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --color-bg: #eef0f5;
        --color-card: #ffffff;
        --color-image-bg: #f6dbd0;
        --color-tag-bg: #ede6fb;
        --color-tag-text: #7c4ee4;
        --color-title: #16181d;
        --color-body: #6b7280;
        --color-footer: #374151;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: var(--color-bg);
        font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
        padding: 24px 16px;
      }

      .card {
        width: 100%;
        max-width: 368px;
        background-color: var(--color-card);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 40px -24px rgba(22, 24, 29, 0.25);
      }

      .card__image {
        height: 152px;
        background-color: var(--color-image-bg);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .card__image svg {
        width: 100%;
        height: 100%;
      }

      .card__content {
        padding: 16px;
      }

      .tag {
        display: inline-block;
        background-color: var(--color-tag-bg);
        color: var(--color-tag-text);
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        padding: 6px 10px;
        border-radius: 6px;
        margin-bottom: 16px;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
        color: var(--color-title);
        margin-bottom: 6px;
      }

      .description {
        font-size: 14px;
        line-height: 1.55;
        color: var(--color-body);
        margin-bottom: 20px;
      }

      .author {
        font-size: 14px;
        font-weight: 500;
        color: var(--color-footer);
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        text-decoration: none;
        color: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Design

  Embracing Minimalism

  From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.

  Annie Spratt -->

    <article class="card">
      <div class="card__image">
        <svg viewBox="0 0 336 152" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
          <rect width="336" height="152" fill="#f6dbd0" />
          <ellipse cx="168" cy="140" rx="120" ry="10" fill="#e9c3b3" opacity="0.6" />
          <path d="M118 96 h100 l-8 44 a10 10 0 0 1 -10 9 h-64 a10 10 0 0 1 -10 -9 z" fill="#c96a3f" />
          <path d="M112 90 h112 a6 6 0 0 1 6 6 v6 h-124 v-6 a6 6 0 0 1 6 -6 z" fill="#a8522f" />
          <rect x="160" y="40" width="16" height="60" rx="8" fill="#4f7b57" />
          <path d="M160 60 c-18 0 -18 -24 0 -24" stroke="#4f7b57" stroke-width="14" fill="none" stroke-linecap="round" />
          <path d="M176 74 c18 0 18 -26 0 -26" stroke="#4f7b57" stroke-width="14" fill="none" stroke-linecap="round" />
          <g fill="#e8f0e6" opacity="0.8">
            <circle cx="163" cy="46" r="1.4" />
            <circle cx="170" cy="52" r="1.4" />
            <circle cx="164" cy="60" r="1.4" />
            <circle cx="172" cy="66" r="1.4" />
            <circle cx="165" cy="74" r="1.4" />
            <circle cx="171" cy="82" r="1.4" />
            <circle cx="164" cy="90" r="1.4" />
          </g>
        </svg>
      </div>

      <div class="card__content">
        <span class="tag">Design</span>
        <h1 class="title">Embracing Minimalism</h1>
        <p class="description">
          From minimalist sculptures to minimalist paintings, this blog will
          inspire you to appreciate the beauty that lies in simplicity.
        </p>
        <p class="author">Annie Spratt</p>
      </div>
    </article>

    <div class="author-info">
      Coded by <a href="#">Your Name Here</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
